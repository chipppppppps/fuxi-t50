name: fuxi t50 stage A (macOS)

# Stage A of the t50 bootstrap.
#
# The device repository cannot bootstrap itself from a clean tree: the ordered
# archive recipes need a prelink candidate under build/native-prelink/, and that
# candidate can only be produced by the prelink step from a kernel that has
# already linked. scripts/build-legacy-stub.py documents the escape hatch: link
# a kernel without the storage and display stacks, then use it to seed the real
# build.
#
# This workflow links such a kernel with a self healing stub archive: the XNU
# link reports the undefined symbols, they are turned into arm64 stubs, and the
# link is retried until it succeeds. The artifact is the resulting
# out/fuxi/kernel/kernel.macho, which seeds build/native-prelink/.
on:
  workflow_dispatch:
    inputs:
      device_ref:
        description: 'device repository ref'
        default: 'old'

permissions:
  contents: read

jobs:
  stage-a:
    runs-on: macos-26
    timeout-minutes: 300
    steps:
      - name: Clone UniXNU, the device repository and the UEFI port
        run: |
          set -euo pipefail
          mkdir -p work && cd work
          git clone --depth 1 https://github.com/UniXNU/UniXNU.git UniXNU
          git clone --depth 1 --branch "${{ inputs.device_ref }}" \
            https://github.com/ljhhkx529/unixnu-fuxi.git unixnu-fuxi
          git clone --depth 1 --branch old \
            https://github.com/ljhhkx529/uefi-fuxi.git uefi-fuxi
          cd UniXNU
          du -sh ../UniXNU ../unixnu-fuxi ../uefi-fuxi

      - name: Repoint submodule pins the upstream no longer serves
        working-directory: work/UniXNU
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import configparser, pathlib, re, subprocess, tempfile

          cfg = configparser.ConfigParser()
          cfg.read('.gitmodules')
          entries = []
          for name in cfg.sections():
              path = cfg[name]['path']
              url = cfg[name]['url']
              out = subprocess.run(['git', 'ls-tree', 'HEAD', '--', path],
                                   capture_output=True, text=True).stdout.strip()
              found = re.match(r'160000 commit ([0-9a-f]{40})', out)
              if found:
                  entries.append((path, url, found.group(1)))
          print(f'{len(entries)} submodule(s) declared in .gitmodules')
          changed = 0
          for path, url, sha in entries:
              with tempfile.TemporaryDirectory() as tmp:
                  def fetch(spec):
                      return subprocess.run(['git', '-C', tmp, 'fetch', '--depth', '1', url, spec],
                                            capture_output=True, text=True)
                  subprocess.run(['git', 'init', '-q', tmp], check=True)
                  if fetch(sha).returncode == 0:
                      continue
                  if fetch('HEAD').returncode != 0:
                      print(f'cannot reach {url}; leaving {path} alone')
                      continue
                  new = subprocess.run(['git', '-C', tmp, 'rev-parse', 'FETCH_HEAD'],
                                       capture_output=True, text=True, check=True).stdout.strip()
              subprocess.run(['git', 'update-index', '--add', '--cacheinfo',
                              f'160000,{new},{path}'], check=True)
              print(f'{path}: {sha[:12]} -> {new[:12]}')
              changed += 1
          print(f'repointed {changed} of {len(entries)} submodule(s)')
          PY

      - name: Select a stage A configuration, repoint the rewritten submodule, fetch
        working-directory: work/UniXNU
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib, re

          device = pathlib.Path('../unixnu-fuxi')
          source = (device / 'configs/fuxi_full_defconfig').read_text()
          # No storage, graphics or ordered archives on stage A: the link only has to produce a Mach-O the prelink
          # step accepts, and every archive recipe needs a prelink candidate that cannot exist yet.
          drop = ('CONFIG_XNU_NATIVE_', 'CONFIG_XNU_VERIFIED_', 'CONFIG_XNU_OWNER_', 'CONFIG_XNU_SHENG_',
                  'CONFIG_XNU_EXTRA_LD_ARCHIVES', 'CONFIG_XNU_BOOT_PROGRESS')
          lines = []
          for line in source.splitlines():
              if line.startswith(drop) or re.match(r'CONFIG_XNU_[A-Z0-9_]*_ARCHIVE=', line):
                  line = '# stage A: ' + line
              lines.append(line)
          if not any(l.startswith('CONFIG_XNU_BUILD_ARCHIVES=') for l in lines):
              lines.append('CONFIG_XNU_BUILD_ARCHIVES=y')
          lines.append('CONFIG_XNU_EXTRA_LD_ARCHIVES="{tree}/../../../stage-a/libStageAStub.a"')
          (device / 'configs/fuxi_stage_a_defconfig').write_text('\n'.join(lines) + '\n')

          board = (device / 'board.toml').read_text()
          # Keep only the archive recipes that need no prelink candidate: corecrypto, the two bundled drivers and
          # libpthread. Every other recipe reads build/native-prelink, which a clean tree cannot have.
          keep = ['build-corecrypto-14.py', 'build-corecrypto-14.py --namespace', 'build-arm-driver.py ArmDTPlatform',
                  'build-arm-driver.py ArmCpu', 'build-libpthread-kernel.py']
          listing = 'archives = [\n' + ''.join(f'  "{name}",\n' for name in keep) + ']\n'
          board = re.sub(r'(?ms)^archives = \[.*?^\]\n', listing, board, count=1)
          (device / 'board.toml').write_text(board)
          print('archives line:', [l for l in board.splitlines() if l.startswith('archives')])
          print('extra ld archives:', [l for l in (device / 'configs/fuxi_stage_a_defconfig').read_text().splitlines()
                                       if l.startswith('CONFIG_XNU_EXTRA_LD_ARCHIVES=')])
          PY
          cd ../unixnu-fuxi && git diff --stat
          cd ../UniXNU
          ./unixnu defconfig fuxi_stage_a_defconfig --device ../unixnu-fuxi
          ./unixnu fetch

      - name: Link a kernel with a self healing stub archive
        working-directory: work/UniXNU
        run: |
          set -euo pipefail
          # The archive has to live outside out/fuxi/tree: the driver reassembles that tree on every run.
          STUBDIR=stage-a
          mkdir -p build/staga "$STUBDIR"
          printf '.section __TEXT,__text,regular,pure_instructions\n' > build/staga/stubs.s
          printf '.globl _stage_a_placeholder\n_stage_a_placeholder:\n\tret\n' >> build/staga/stubs.s
          link_stub() {
            xcrun clang -arch arm64 -c build/staga/stubs.s -o "$STUBDIR/stubs.o"
            xcrun ar rcs "$STUBDIR/libStageAStub.a" "$STUBDIR/stubs.o"
          }
          link_stub
          for attempt in 1 2 3 4 5 6; do
            echo "== link attempt $attempt =="
            rm -f out/fuxi/logs/kernel.log
            if ./unixnu build kernel; then
              echo "kernel linked on attempt $attempt"
              break
            fi
            python3 - <<'PY'
          import pathlib, re
          logs = sorted(pathlib.Path('out/fuxi/logs').glob('kernel*.log'))
          text = '\n'.join(p.read_text(errors='replace') for p in logs)
          names = []
          for name in re.findall(r'^\s+"(_[A-Za-z0-9_]+)", referenced from:', text, re.M):
              if name not in names:
                  names.append(name)
          stubs = pathlib.Path('build/staga/stubs.s')
          seen = set(re.findall(r'\.globl (\S+)', stubs.read_text()))
          added = [n for n in names if n not in seen]
          with stubs.open('a') as handle:
              for name in added:
                  handle.write(f'.globl {name}\n{name}:\n\tret\n')
          print(f'{len(names)} undefined symbol(s), {len(added)} new stub(s)')
          print('\n'.join(added))
          PY
            link_stub
            if [ "${attempt}" = "6" ]; then
              echo "::error::the kernel still does not link after six attempts"
              exit 1
            fi
          done
          ls -l out/fuxi/kernel out/fuxi/build/native-prelink 2>/dev/null || true
          cat out/fuxi/kernel/kernel.macho.json 2>/dev/null || true

      - name: Collect the stage A kernel
        if: always()
        run: |
          set -euo pipefail
          cd work/UniXNU
          mkdir -p "$RUNNER_TEMP/stage-a"
          cp -R out/fuxi/kernel "$RUNNER_TEMP/stage-a/kernel" 2>/dev/null || true
          cp -R out/fuxi/build/native-prelink "$RUNNER_TEMP/stage-a/native-prelink" 2>/dev/null || true
          cp build/staga/stubs.s "$RUNNER_TEMP/stage-a/stubs.s" 2>/dev/null || true
          cp -R out/fuxi/logs "$RUNNER_TEMP/stage-a/logs" 2>/dev/null || true
          du -sh "$RUNNER_TEMP/stage-a"
          ls -l "$RUNNER_TEMP/stage-a"/kernel || true

      - name: Upload the stage A artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuxi-stage-a-${{ github.run_attempt }}
          path: ${{ runner.temp }}/stage-a
          if-no-files-found: warn
