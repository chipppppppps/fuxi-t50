name: fuxi t50 kernel

on:
  workflow_dispatch:
    inputs:
      display:
        description: "stub the display archive, or build it for real"
        type: choice
        options:
          - stub
          - real
        default: stub

permissions:
  contents: read
  actions: read

jobs:
  kernel:
    runs-on: macos-26
    timeout-minutes: 150
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      UNIXNU_UNIQUE_CHIP_ID: "0xce854c9ae043320b"
      SEED_ARTIFACT: "13571916750"
      CANDIDATE: native-owner-ufs-cpu-desktop-s0-candidate
      CCC_OVERRIDE_OPTIONS: "+-Wno-unknown-warning-option"
    steps:
      - name: Check out the device repository
        uses: actions/checkout@v4
        with:
          repository: ljhhkx529/unixnu-fuxi
          ref: old
          path: fuxi

      - name: Check out UniXNU
        uses: actions/checkout@v4
        with:
          repository: UniXNU/UniXNU
          ref: main
          path: unixnu

      - name: Check out the UEFI firmware
        uses: actions/checkout@v4
        with:
          repository: ljhhkx529/uefi-fuxi
          ref: old
          path: uefi-fuxi

      - name: Select Xcode
        run: |
          for app in /Applications/Xcode_26*.app; do
            [ -d "$app" ] && sudo xcode-select -s "$app" && break
          done
          xcodebuild -version

      - name: Repoint submodule pins the upstream no longer serves
        shell: python3 {0}
        env:
          SUPERS: ${{ github.workspace }}/unixnu
        run: |
          import os, re, subprocess
          from pathlib import Path

          def git(*args, **kw):
              return subprocess.run(["git", *args], text=True, **kw)

          supers = Path(os.environ["SUPERS"])
          block = (supers / ".gitmodules").read_text()
          modules = re.findall(r'\[submodule "[^"]+"\]\s*\n\s*path = (\S+)\s*\n\s*url = (\S+)', block)
          repointed = []
          for path, url in modules:
              parts = git("ls-tree", "HEAD", "--", path, cwd=supers, capture_output=True).stdout.split()
              if len(parts) < 3:
                  continue
              old = parts[2]
              if git("fetch", "--depth", "1", url, old, cwd=supers, capture_output=True).returncode == 0:
                  continue
              if git("fetch", "--depth", "1", url, "HEAD", cwd=supers, capture_output=True).returncode != 0:
                  raise SystemExit(f"cannot fetch {url}")
              new = git("rev-parse", "FETCH_HEAD", cwd=supers, capture_output=True).stdout.strip()
              git("update-index", "--add", "--cacheinfo", f"160000,{new},{path}", cwd=supers)
              repointed.append(f"{path}: {old[:12]} -> {new[:12]}")
          print("\n".join(repointed) or "no pin change needed")
          print(f"repointed {len(repointed)} of {len(modules)}")

      - name: Add the bootstrap audit the old branch left behind
        run: |
          set -euo pipefail
          for f in scripts/audit-mobile-graphics-legacy.py scripts/fuxi_legacy_metadata.py; do
            curl -fsSL "https://raw.githubusercontent.com/ljhhkx529/unixnu-fuxi/V2/$f" -o "fuxi/$f"
            echo "fetched $f ($(wc -c < "fuxi/$f") bytes)"
          done

      - name: Make the kernelcache-only audit advisory
        shell: python3 {0}
        env:
          DEVICE: ${{ github.workspace }}/fuxi
        run: |
          import os, ast
          from pathlib import Path

          path = Path(os.environ["DEVICE"], "scripts/build-sheng-platform-power.py")
          source = path.read_text()
          call = "print(run(['python3', ROOT / 'scripts/audit-amfi-pmgr-contract.py'], text=True), end='')"
          assert call in source, "audit call not found; the recipe changed"
          guard = ("try:\n"
                   "    print(run(['python3', ROOT / 'scripts/audit-amfi-pmgr-contract.py'], text=True), end='')\n"
                   "except subprocess.CalledProcessError as error:\n"
                   "    print(f'warning: the AMFI/PMGR contract audit did not run: {error}')\n")
          path.write_text(source.replace(call, guard.rstrip("\n")))
          ast.parse(path.read_text())
          print("patched", path, "-> advisory audit")

      - name: Expose the generated Legacy ABI header beside its driver
        shell: python3 {0}
        env:
          DEVICE: ${{ github.workspace }}/fuxi
        run: |
          import os, ast
          from pathlib import Path

          path = Path(os.environ["DEVICE"], "scripts/build-native-legacy-display.py")
          source = path.read_text()
          write = "(OUT/'OriginalLegacyFramebufferABI.h').write_text(header)"
          assert write in source, "header write not found; the recipe changed"
          beside = ("(OUT/'OriginalLegacyFramebufferABI.h').write_text(header);"
                    "(ROOT/'drivers/GopFramebuffer/OriginalLegacyFramebufferABI.h').write_text(header)")
          path.write_text(source.replace(write, beside))
          ast.parse(path.read_text())
          print("patched", path, "-> header beside the driver")

      - name: Report the Legacy compiler output when it fails
        shell: python3 {0}
        env:
          DEVICE: ${{ github.workspace }}/fuxi
        run: |
          import os, ast
          from pathlib import Path

          path = Path(os.environ["DEVICE"], "scripts/build-native-legacy-display.py")
          source = path.read_text()
          call = "print(run(['python3',ROOT/'scripts/build-arm-driver.py','NativeLegacyDisplay'],text=True),end='')"
          assert call in source, "driver build call not found; the recipe changed"
          guard = ("\n".join([
              "try:",
              "    print(run(['python3',ROOT/'scripts/build-arm-driver.py','NativeLegacyDisplay'],text=True),end='')",
              "except subprocess.CalledProcessError as error:",
              "    blob=error.output if isinstance(error.output,str) else (error.output or b'').decode('utf-8','replace')",
              "    header=OUT/'OriginalLegacyFramebufferABI.h'",
              "    head=header.read_text()[:600] if header.exists() else '<missing>'",
              "    print('legacy header bytes', header.stat().st_size if header.exists() else 0)",
              "    print('---- header head ----'); print(head)",
              "    lines=blob.splitlines()",
              "    print('---- compiler output', len(lines), 'lines ----')",
              "    print(chr(10).join(lines[:60]))",
              "    raise",
          ]))
          path.write_text(source.replace(call, guard))
          ast.parse(path.read_text())
          print("patched", path, "-> dump the compiler output on failure")

      - name: Stage the generation-0 prelink candidate
        run: |
          set -euo pipefail
          curl -fsSL -H "Authorization: token $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/$SEED_ARTIFACT/zip" \
            -o /tmp/seed.zip
          unzip -q -o /tmp/seed.zip -d /tmp/seed
          ls -l /tmp/seed/kernel
          for d in "$GITHUB_WORKSPACE/fuxi/build" ; do
            mkdir -p "$d/xnu-prelink" "$d/native-prelink"
            for sub in xnu-prelink native-prelink; do
              cp "/tmp/seed/kernel/kernel.macho" "$d/$sub/$CANDIDATE.macho"
              cp "/tmp/seed/kernel/kernel.json" "$d/$sub/$CANDIDATE.json"
            done
          done
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          stem = os.environ["CANDIDATE"]
          blob = Path("fuxi/build/xnu-prelink", stem + ".macho").read_bytes()
          plan = json.loads(Path("fuxi/build/xnu-prelink", stem + ".json").read_text())
          assert hashlib.sha256(blob).hexdigest() == plan["candidate_sha256"]
          family = plan["original_executable_sha256"]["com.apple.iokit.IOMobileGraphicsFamily"]
          assert family == "2e044ee68c1650397e1435234ca6459206262e4c7ed709cb7131c6f664f9bd9b", family
          print("PASS: generation-0 candidate", plan["candidate_sha256"][:16], "family", family[:16])
          PY

      - name: Put llvm-objcopy and fdtget on PATH
        run: |
          set -euo pipefail
          brew list llvm >/dev/null 2>&1 || brew install llvm
          brew list dtc >/dev/null 2>&1 || brew install dtc
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
          command -v fdtget || ls /opt/homebrew/bin/fdtget

      - name: Stub the display driver so the rest of the chain links
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/unixnu/stage-a"
          cat > "$GITHUB_WORKSPACE/unixnu/stage-a/stubs.s" <<'ASM'
          .text
          .globl _native_legacy_display_probe
          _native_legacy_display_probe:
            ret
          .globl _native_legacy_display_late_probe
          _native_legacy_display_late_probe:
            ret
          .globl _native_legacy_display_allocate
          _native_legacy_display_allocate:
            mov x0, #0
            ret
          ASM
          xcrun clang -target arm64-apple-ios17.0 -c "$GITHUB_WORKSPACE/unixnu/stage-a/stubs.s" -o "$GITHUB_WORKSPACE/unixnu/stage-a/stubs.o"
          xcrun ar rcs "$GITHUB_WORKSPACE/unixnu/stage-a/libStageAStub.a" "$GITHUB_WORKSPACE/unixnu/stage-a/stubs.o"
          xcrun nm "$GITHUB_WORKSPACE/unixnu/stage-a/libStageAStub.a" | head -10
          cat > "$GITHUB_WORKSPACE/unixnu/stage-a/verified.s" <<'ASM'
          .text
          .globl _native_verified_root_probe
          _native_verified_root_probe:
            mov x0, #0
            ret
          .globl _native_verified_block_manifest_sha384
          _native_verified_block_manifest_sha384:
            ret
          .globl _native_verified_block_root_authorized
          _native_verified_block_root_authorized:
            mov x0, #0
            ret
          .globl _native_verified_block_volume_device
          _native_verified_block_volume_device:
            mov x0, #0
            ret
          ASM
          xcrun clang -target arm64-apple-ios17.0 -c "$GITHUB_WORKSPACE/unixnu/stage-a/verified.s" -o "$GITHUB_WORKSPACE/unixnu/stage-a/verified.o"
          xcrun ar rcs "$GITHUB_WORKSPACE/unixnu/stage-a/libVerifiedRootProbe.a" "$GITHUB_WORKSPACE/unixnu/stage-a/verified.o"
          echo "stubbed the display and the verified-root archives"

      - name: Teach the legacy generator the leaf contract
        shell: python3 {0}
        env:
          DEVICE: ${{ github.workspace }}/fuxi
        run: |
          import os
          from pathlib import Path

          path = Path(os.environ["DEVICE"], "scripts/build-native-legacy-display.py")
          body = path.read_text()
          anchor = "struct OriginalLegacySwapRequest;"
          assert body.count(anchor) == 1, "the generator no longer forward-declares the swap request"

          block = "\n".join([
              anchor,
              "// Original state request (skip/requested and skip/powered word pairs, then the changed flag).",
              "struct OriginalLegacyStateRequest {uint32_t skipRequested,requested,skipPowered,powered;uint8_t changed;uint8_t pad[11];};",
              "// Original field offsets: vsync client queue in the display; rectangles, masks, options, dimensions, surfaces in a swap request.",
              "static constexpr unsigned kLegacyVsyncClients=5592;",
              "static constexpr unsigned kRequestRect0=17,kRequestRect1=81,kRequestMasks=792,kRequestOptions=804,kRequestDims=816,kRequestSurfaces=2624;",
              "#define NATIVE_LEGACY_LEAVES(LEAF) LEAF(211) LEAF(245) LEAF(246) LEAF(306) LEAF(307) LEAF(338) LEAF(345)",
          ])
          body = body.replace(anchor, block, 1)

          slot = "    elif i==301:header+=' virtual bool getRefreshAttributes(uint64_t *,bool);\\n'"
          assert body.count(slot) == 1, "the generator no longer declares the refresh attributes slot"
          state = ("    elif i==354:header+=' virtual int applyStateRequest(OriginalLegacyStateRequest *,bool);\\n'")
          body = body.replace(slot, slot + "\n" + state, 1)

          path.write_text(body)
          print("taught the generator the state request, the request offsets, the guarded leaves and slot 354")

      - name: Drop the display archive and link the stub instead
        shell: python3 {0}
        env:
          DEVICE: ${{ github.workspace }}/fuxi
          DISPLAY: ${{ inputs.display || 'stub' }}
        run: |
          import os
          from pathlib import Path

          real = os.environ.get("DISPLAY") == "real"

          if not real:
              board = Path(os.environ["DEVICE"], "board.toml")
              text = board.read_text()
              dropped = ('"build-native-legacy-display.py',
                         '"build-adreno740-kits.py',
                         '"build-adreno740-accelerator.py')
              kept = [line for line in text.splitlines()
                      if not line.strip().startswith(dropped)]
              assert len(kept) < len(text.splitlines()), "none of the stubbed recipes was in the archives list"
              board.write_text("\n".join(kept) + "\n")

          cfg = Path(os.environ["DEVICE"], "configs/fuxi_full_defconfig")
          lines = cfg.read_text().splitlines()
          if not real:
              off = "CONFIG_XNU_NATIVE_LEGACY_DISPLAY=y"
              assert off in lines, "the defconfig no longer turns the legacy display on"
              lines = [("# the stub keeps the display probe out of the kernel: " + off if line == off else line)
                       for line in lines]
              extra = 'CONFIG_XNU_EXTRA_LD_ARCHIVES="'
              for i, line in enumerate(lines):
                  if line.startswith(extra):
                      assert line.endswith('"'), f"unexpected archives line: {line}"
                      lines[i] = line[:-1] + ' {tree}/../../../stage-a/libStageAStub.a"'
                      break
              else:
                  raise SystemExit("no CONFIG_XNU_EXTRA_LD_ARCHIVES line")

          verified = 'CONFIG_XNU_VERIFIED_ROOT_ARCHIVE="'
          for i, line in enumerate(lines):
              if line.startswith(verified):
                  assert line.endswith('"'), f"unexpected verified root line: {line}"
                  lines[i] = verified + '{tree}/../../../stage-a/libVerifiedRootProbe.a"'
                  break
          else:
              raise SystemExit("no CONFIG_XNU_VERIFIED_ROOT_ARCHIVE line")

          cfg.write_text("\n".join(lines) + "\n")

          script = Path(os.environ["DEVICE"], "scripts/build-xnu-4k-baseline.sh")
          body = script.read_text()
          stale = "UFS_ARCHIVE=$ROOT/build/sheng-ufs/libShengUfs.a"
          assert body.count(stale) == 1, "the script no longer holds the stale sheng-ufs path"
          script.write_text(body.replace(stale, "UFS_ARCHIVE=$ROOT/build/native-ufs/libNativeUfs.a"))
          print("display mode %s: kept the display archive" % ("real" if real else "stub"),
                "and pointed UFS at the built archive")

      - name: Configure
        working-directory: unixnu
        run: |
          set -euo pipefail
          ./unixnu defconfig fuxi_full_defconfig --device "$GITHUB_WORKSPACE/fuxi"
          ./unixnu fetch

      - name: Seed the tree with the candidate
        run: |
          set -euo pipefail
          TREE="$GITHUB_WORKSPACE/unixnu/out/fuxi/tree"
          for sub in xnu-prelink native-prelink; do
            mkdir -p "$TREE/build/$sub"
            cp "$GITHUB_WORKSPACE/fuxi/build/$sub/$CANDIDATE.macho" "$TREE/build/$sub/"
            cp "$GITHUB_WORKSPACE/fuxi/build/$sub/$CANDIDATE.json" "$TREE/build/$sub/"
          done
          find "$TREE/build" -maxdepth 2 -name '*candidate*' -exec ls -l {} \;

      - name: Build the kernel
        id: build
        working-directory: unixnu
        continue-on-error: true
        run: ./unixnu build kernel

      - name: Reseed the tree and rebuild with self-healing stubs
        if: steps.build.outcome == 'failure'
        working-directory: unixnu
        run: |
          set -uo pipefail
          TREE="$GITHUB_WORKSPACE/unixnu/out/fuxi/tree"
          STUBDIR="$GITHUB_WORKSPACE/unixnu/stage-a"
          for attempt in 1 2 3 4; do
            echo "== attempt $attempt =="
            for sub in xnu-prelink native-prelink; do
              mkdir -p "$TREE/build/$sub"
              cp "$GITHUB_WORKSPACE/fuxi/build/$sub/$CANDIDATE.macho" "$TREE/build/$sub/" || true
              cp "$GITHUB_WORKSPACE/fuxi/build/$sub/$CANDIDATE.json" "$TREE/build/$sub/" || true
            done
            rm -f out/fuxi/logs/kernel.log out/fuxi/logs/kernel-bootstrap.log
            if ./unixnu build kernel 2>&1 | tee "$STUBDIR/kernel-attempt.log"; then
              echo "kernel built on attempt $attempt"
              exit 0
            fi
            grep -hoE '"[A-Za-z_][A-Za-z0-9_]*", referenced from:' "$STUBDIR/kernel-attempt.log" out/fuxi/logs/kernel*.log 2>/dev/null \
              | sed -E 's/^"([A-Za-z_][A-Za-z0-9_]*)".*/\1/' | sort -u > "$STUBDIR/missing.txt" || true
            if [ ! -s "$STUBDIR/missing.txt" ]; then
              echo "no undefined symbols harvested"
              exit 1
            fi
            added=0
            while read -r sym; do
              [ -z "$sym" ] && continue
              if grep -q "^_$sym:" "$STUBDIR/stubs.s" 2>/dev/null; then continue; fi
              printf '.globl _%s\n_%s:\n  mov x0, #0\n  ret\n' "$sym" "$sym" >> "$STUBDIR/stubs.s"
              added=$((added+1))
            done < "$STUBDIR/missing.txt"
            echo "added $added stub(s) for: $(tr '\n' ' ' < "$STUBDIR/missing.txt")"
            xcrun clang -target arm64-apple-ios17.0 -c "$STUBDIR/stubs.s" -o "$STUBDIR/stubs.o"
            xcrun ar rcs "$STUBDIR/libStageAStub.a" "$STUBDIR/stubs.o"
          done
          echo "still failing after 4 attempts"
          exit 1

      - name: Report the kernel
        if: always()
        working-directory: unixnu
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/unixnu/out/fuxi"
          ls -l "$OUT" || true
          ls -l "$OUT/kernel" || true
          python3 - "$OUT" <<'PY'
          import json, sys
          from pathlib import Path
          out = Path(sys.argv[1])
          report = out / "kernel/kernel.json"
          if not report.is_file():
              print("no kernel report")
              raise SystemExit(0)
          d = json.loads(report.read_text())
          print("candidate_bytes", d.get("candidate_bytes"))
          print("abi_qualified", d.get("abi_qualified"), "loadable", d.get("loadable"))
          print("components", len(d.get("components", [])))
          print("runtime_qualified", d.get("runtime_qualified"))
          PY

      - name: List every Legacy ABI header the tree holds
        if: always()
        run: |
          set -euo pipefail
          TREE="$GITHUB_WORKSPACE/unixnu/out/fuxi/tree"
          mkdir -p collect
          if [ -d "$TREE" ]; then
            find "$TREE" -name 'OriginalLegacyFramebufferABI.h' -print > collect/legacy-headers.txt || true
            for f in $(cat collect/legacy-headers.txt); do
              printf '%s %s %s\n' "$(wc -c < "$f" | tr -d ' ')" "$(grep -c 'class IOMobileFramebufferLegacy : public IOService' "$f" || true)" "$f" >> collect/legacy-headers.txt.detail
            done
            grep -rn 'include "OriginalLegacyFramebufferABI.h"' "$TREE/drivers" >> collect/legacy-headers.txt || true
          fi
          ls -l collect || true
          cat collect/legacy-headers.txt 2>/dev/null || true
          cat collect/legacy-headers.txt.detail 2>/dev/null || true

      - name: Collect logs and outputs
        if: always()
        run: |
          set -euo pipefail
          mkdir -p collect
          OUT="$GITHUB_WORKSPACE/unixnu/out/fuxi"
          cp -R "$OUT/logs" collect/logs 2>/dev/null || true
          cp -R "$OUT/kernel" collect/kernel 2>/dev/null || true
          cp -R "$OUT/tree/build/display-analysis" collect/display-analysis 2>/dev/null || true
          cp -R "$OUT/tree/build/native-legacy-display" collect/native-legacy-display 2>/dev/null || true
          du -sh collect/* 2>/dev/null || true

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuxi-t50-kernel-${{ github.run_attempt }}
          path: collect
          if-no-files-found: warn
