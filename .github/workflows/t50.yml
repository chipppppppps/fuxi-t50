name: fuxi t50 (macOS)

# Build the public ljhhkx529 fuxi line (NativeUfs + NativeAdreno + NativeLegacyDisplay).
# Derived from yigezhong011-ops/ios-fuxi .github/workflows/unixnu-macos.yml.
on:
  workflow_dispatch:
    inputs:
      steps:
        description: 'unixnu build steps'
        default: 'kernel payload'
        type: choice
        options: ['kernel', 'kernel payload', 'kernel userdata payload']
      device_ref:
        description: 'device repository ref'
        default: 'old'

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 300
    steps:
      - name: Clone UniXNU, the device repository and the UEFI port
        run: |
          set -euo pipefail
          mkdir -p work && cd work
          git clone --depth 1 https://github.com/UniXNU/UniXNU.git UniXNU
          git clone --depth 1 --branch "${{ inputs.device_ref }}" \
            https://github.com/ljhhkx529/unixnu-fuxi.git unixnu-fuxi
          git clone --depth 1 --branch old \
            https://github.com/ljhhkx529/uefi-fuxi.git uefi-fuxi
          cd UniXNU
          du -sh ../UniXNU ../unixnu-fuxi ../uefi-fuxi

      - name: Repoint submodule pins the upstream no longer serves
        working-directory: work/UniXNU
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import configparser, pathlib, re, subprocess, tempfile

          cfg = configparser.ConfigParser()
          cfg.read('.gitmodules')
          entries = []
          for name in cfg.sections():
              path = cfg[name]['path']
              url = cfg[name]['url']
              out = subprocess.run(['git', 'ls-tree', 'HEAD', '--', path],
                                   capture_output=True, text=True).stdout.strip()
              found = re.match(r'160000 commit ([0-9a-f]{40})', out)
              if found:
                  entries.append((path, url, found.group(1)))
          print(f'{len(entries)} submodule(s) declared in .gitmodules')
          changed = 0
          for path, url, sha in entries:
              with tempfile.TemporaryDirectory() as tmp:
                  def fetch(spec):
                      return subprocess.run(['git', '-C', tmp, 'fetch', '--depth', '1', url, spec],
                                            capture_output=True, text=True)
                  subprocess.run(['git', 'init', '-q', tmp], check=True)
                  if fetch(sha).returncode == 0:
                      continue
                  if fetch('HEAD').returncode != 0:
                      print(f'cannot reach {url}; leaving {path} alone')
                      continue
                  new = subprocess.run(['git', '-C', tmp, 'rev-parse', 'FETCH_HEAD'],
                                       capture_output=True, text=True, check=True).stdout.strip()
              subprocess.run(['git', 'update-index', '--add', '--cacheinfo',
                              f'160000,{new},{path}'], check=True)
              print(f'{path}: {sha[:12]} -> {new[:12]}')
              changed += 1
          print(f'repointed {changed} of {len(entries)} submodule(s)')
          PY

      - name: Select the configuration, repoint the rewritten submodule, fetch
        working-directory: work/UniXNU
        run: |
          set -euo pipefail
          # No Data seed exists yet, so the persistent Data mount cannot be satisfied. Turn it off for
          # this RAM-only probe: the point is to see how far the kernel and the display get without it.
          python3 - <<'PY'
          import pathlib
          path = pathlib.Path('../unixnu-fuxi/configs/fuxi_full_defconfig')
          lines = path.read_text().splitlines()
          out = []
          for line in lines:
              if line.strip() == 'CONFIG_XNU_OWNER_DATA_MOUNT=y':
                  out.append('# RAM-only probe: no Data seed, so the persistent Data mount is off')
                  out.append('# ' + line)
              else:
                  out.append(line)
          path.write_text('\n'.join(out) + '\n')
          print('\n'.join(l for l in out if 'OWNER_DATA_MOUNT' in l))
          PY
          ./unixnu defconfig fuxi_full_defconfig -D ../unixnu-fuxi --uefi ../uefi-fuxi
          grep -n 'OWNER_DATA_MOUNT' out/fuxi/.config || true
          D=../unixnu-fuxi/drivers/QcomXnuUsbDebug
          if [ ! -f "$D/Makefile" ] && [ ! -e "$D/.git" ]; then
            rm -rf "$D"
            git clone --depth 1 https://github.com/xiaoleGun/QcomXnuUsbDebug.git "$D" || true
            NEW=$(git -C "$D" rev-parse HEAD 2>/dev/null || true)
            if [ -n "$NEW" ]; then
              git -C ../unixnu-fuxi update-index --add \
                --cacheinfo 160000,"$NEW",drivers/QcomXnuUsbDebug || true
              echo "repointed QcomXnuUsbDebug -> $NEW"
            fi
          fi
          ls "$D" | head -3
          ./unixnu fetch -D ../unixnu-fuxi --uefi ../uefi-fuxi 2>&1 | tail -20

      - name: Fetch the IPSW components (kernelcache, device tree, trust caches)
        working-directory: work/UniXNU
        run: |
          set -euo pipefail
          ./unixnu ipsw fetch -D ../unixnu-fuxi 2>&1 | tail -10
          ls -l out/ipsw/*/ | head -10

      - name: Build
        working-directory: work/UniXNU
        env:
          UNIXNU_UNIQUE_CHIP_ID: '0xce854c9ae043320b'
        run: |
          set -euo pipefail
          ./unixnu build ${{ inputs.steps }} -D ../unixnu-fuxi --uefi ../uefi-fuxi -j4 2>&1 | tail -60
          find out -name 'payload.img' -o -name 'kernel.macho' -o -name '*.bundle' | head -20

      - name: Pack the boot image
        working-directory: work/UniXNU
        run: |
          set -euo pipefail
          ./unixnu build firmware -D ../unixnu-fuxi --uefi ../uefi-fuxi 2>&1 | tail -20 || true
          ls ../uefi-fuxi/scripts/ | head -20 || true
          python3 ../uefi-fuxi/scripts/bootimage.py \
            --unixnu-root . --device ../unixnu-fuxi --uefi ../uefi-fuxi \
            --ramdisk out/fuxi/payload/payload.img \
            -o out/fuxi/boot/boot.img 2>&1 | tail -20 || true
          ls -lh out/fuxi/boot/ 2>/dev/null || true

      - name: Collect the artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unixnu-fuxi
          path: |
            work/UniXNU/out/fuxi/boot/**
            work/UniXNU/out/fuxi/payload/**
            work/UniXNU/out/fuxi/kernel/**
            work/UniXNU/out/fuxi/userdata/**
            work/UniXNU/out/fuxi/logs/**
          if-no-files-found: warn
