name: fuxi t50 boot image

on:
  workflow_dispatch:
    inputs:
      kernel_artifact:
        description: "artifact id that holds the linked kernel (fuxi-t50-kernel-*)"
        required: true
        default: ""

permissions:
  contents: read
  actions: read

jobs:
  pack:
    runs-on: macos-26
    timeout-minutes: 120
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      UNIXNU_UNIQUE_CHIP_ID: "0xce854c9ae043320b"
      KERNEL_ARTIFACT: ${{ inputs.kernel_artifact }}
    steps:
      - name: Check out the device repository
        uses: actions/checkout@v4
        with:
          repository: ljhhkx529/unixnu-fuxi
          ref: old
          path: fuxi

      - name: Check out UniXNU
        uses: actions/checkout@v4
        with:
          repository: UniXNU/UniXNU
          ref: main
          path: unixnu

      - name: Check out the UEFI firmware
        uses: actions/checkout@v4
        with:
          repository: ljhhkx529/uefi-fuxi
          ref: old
          path: uefi-fuxi

      - name: Select Xcode
        run: |
          for app in /Applications/Xcode_26*.app; do
            [ -d "$app" ] && sudo xcode-select -s "$app" && break
          done
          xcodebuild -version

      - name: Repoint submodule pins the upstream no longer serves
        shell: python3 {0}
        env:
          SUPERS: ${{ github.workspace }}/unixnu
        run: |
          import os, re, subprocess
          from pathlib import Path

          def git(*args, **kw):
              return subprocess.run(["git", *args], text=True, **kw)

          supers = Path(os.environ["SUPERS"])
          block = (supers / ".gitmodules").read_text()
          modules = re.findall(r'\[submodule "[^"]+"\]\s*\n\s*path = (\S+)\s*\n\s*url = (\S+)', block)
          repointed = []
          for path, url in modules:
              parts = git("ls-tree", "HEAD", "--", path, cwd=supers, capture_output=True).stdout.split()
              if len(parts) < 3:
                  continue
              old = parts[2]
              if git("fetch", "--depth", "1", url, old, cwd=supers, capture_output=True).returncode == 0:
                  continue
              if git("fetch", "--depth", "1", url, "HEAD", cwd=supers, capture_output=True).returncode != 0:
                  raise SystemExit(f"cannot fetch {url}")
              new = git("rev-parse", "FETCH_HEAD", cwd=supers, capture_output=True).stdout.strip()
              git("update-index", "--add", "--cacheinfo", f"160000,{new},{path}", cwd=supers)
              repointed.append(f"{path}: {old[:12]} -> {new[:12]}")
          print("\n".join(repointed) or "no pin change needed")
          print(f"repointed {len(repointed)} of {len(modules)}")

      - name: Make the persistent Data volume optional for a display probe
        shell: python3 {0}
        env:
          DEVICE: ${{ github.workspace }}/fuxi
        run: |
          import os
          from pathlib import Path

          cfg = Path(os.environ["DEVICE"], "configs/fuxi_full_defconfig")
          lines = cfg.read_text().splitlines()
          target = "CONFIG_XNU_OWNER_DATA_MOUNT=y"
          assert target in lines, "the defconfig no longer turns the Data mount on"
          cfg.write_text("\n".join(("# the payload has no Data seed yet: " + target if line == target else line)
                                   for line in lines) + "\n")
          print("commented out", target)

      - name: Keep the display probe off the phone's storage
        shell: python3 {0}
        env:
          DEVICE: ${{ github.workspace }}/fuxi
        run: |
          import os
          from pathlib import Path

          board = Path(os.environ["DEVICE"], "board.toml")
          text = board.read_text()
          off = ('"native-fuxi-ufs-root=1",',
                 '"sheng-log=1",',
                 '"sheng-data-persist=2",')
          kept = [line for line in text.splitlines() if line.strip() not in off]
          assert len(kept) < len(text.splitlines()), "none of the storage arguments was in kernel_args"
          board.write_text("\n".join(kept) + "\n")
          assert "native-fuxi-ufs-root" not in board.read_text(), "the UFS root argument survived"
          print("dropped the storage arguments, so the probe cannot write the userdata partition")

      - name: Let the entry probe treat nop-filled padding as empty
        shell: python3 {0}
        env:
          DEVICE: ${{ github.workspace }}/fuxi
        run: |
          import os
          from pathlib import Path

          probe = Path(os.environ["DEVICE"], "scripts/patch-xnu-entry-probe.py")
          text = probe.read_text()
          helper = "\n".join([
              "def nop_or_zero(chunk):",
              '    """True when this run is padding: zero bytes or the AArch64 nop word."""',
              '    whole = len(chunk) - len(chunk) % 4',
              "    for i in range(0, whole, 4):",
              '        if chunk[i:i + 4] not in (b"\\x00\\x00\\x00\\x00", b"\\x1f\\x20\\x03\\xd5"):',
              "            return False",
              "    tail = chunk[whole:]",
              '    if tail and tail != b"\\x00" * len(tail) and tail != b"\\x1f\\x20\\x03\\xd5"[:len(tail)]:',
              "        return False",
              "    return True",
              "",
              "",
          ])
          anchor = "def unixthread_pc(data):"
          assert text.count(anchor) == 1, "the probe script moved"
          text = text.replace(anchor, helper + anchor)
          swaps = (
              ("if any(data[file_offset(va):file_offset(va) + CAVE_SIZE]):",
               "if not nop_or_zero(data[file_offset(va):file_offset(va) + CAVE_SIZE]):"),
              ("or any(data[file_offset(PANIC_CAVE):file_offset(PANIC_CAVE_END)]):",
               "or not nop_or_zero(data[file_offset(PANIC_CAVE):file_offset(PANIC_CAVE_END)]):"),
              ("if any(data[file_offset(load):file_offset(load) + len(code)]):",
               "if not nop_or_zero(data[file_offset(load):file_offset(load) + len(code)]):"),
          )
          for old, new in swaps:
              assert text.count(old) == 1, "the padding check moved: " + old
              text = text.replace(old, new)
          probe.write_text(text)
          compile(text, "patch-xnu-entry-probe.py", "exec")
          print("the entry probe now accepts nop padding, which is what this kernel links")

      - name: Install the tools the boot image needs
        run: |
          set -euo pipefail
          brew list dtc >/dev/null 2>&1 || brew install dtc
          brew list mtools >/dev/null 2>&1 || brew install mtools
          brew list llvm >/dev/null 2>&1 || brew install llvm
          brew list lld >/dev/null 2>&1 || brew install lld
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix lld)/bin" >> "$GITHUB_PATH"
          command -v fdtget || ls /opt/homebrew/bin/fdtget
          ls "$(brew --prefix llvm)/bin/llvm-nm"
          ls "$(brew --prefix lld)/bin/ld.lld"

      - name: Configure
        working-directory: unixnu
        run: |
          set -euo pipefail
          ./unixnu defconfig fuxi_full_defconfig --device "$GITHUB_WORKSPACE/fuxi"
          ./unixnu fetch

      - name: Restore the linked kernel from the artifact
        run: |
          set -euo pipefail
          gh api "repos/${{ github.repository }}/actions/artifacts/$KERNEL_ARTIFACT/zip" > /tmp/kernel.zip
          unzip -q /tmp/kernel.zip -d /tmp/kernel-artifact
          ls -l /tmp/kernel-artifact
          mkdir -p unixnu/out/fuxi/kernel
          cp /tmp/kernel-artifact/kernel/kernel.macho unixnu/out/fuxi/kernel/kernel.macho
          cp /tmp/kernel-artifact/kernel/kernel.json unixnu/out/fuxi/kernel/kernel.json
          ls -l unixnu/out/fuxi/kernel

      - name: Bring the original Apple trust bundle
        working-directory: unixnu
        continue-on-error: true
        run: |
          set -euo pipefail
          ./unixnu ipsw fetch StaticTrustCache Cryptex1,SystemTrustCache --device "$GITHUB_WORKSPACE/fuxi"
          python3 - <<'PY'
          import glob, hashlib, json, struct
          from pathlib import Path


          def seq_body(data):
              assert data[0] == 0x30, "the trust cache is not a DER sequence"
              at, size = 1, data[1]
              if size & 0x80:
                  count = size & 0x7F
                  size = int.from_bytes(data[2:2 + count], "big")
                  at = 2 + count
              assert at + size == len(data), "the DER length does not span the file"
              return data[at:at + size]


          def items(body):
              at, out = 0, []
              while at < len(body):
                  tag = body[at]
                  at += 1
                  size = body[at]
                  at += 1
                  if size & 0x80:
                      count = size & 0x7F
                      size = int.from_bytes(body[at:at + count], "big")
                      at += count
                  out.append((tag, body[at:at + size]))
                  at += size
              return out


          def module(path):
              top = items(seq_body(Path(path).read_bytes()))
              assert top[0][1] == b"IM4P", f"{path} is not an IM4P"
              octets = [value for tag, value in top if tag == 0x04]
              assert len(octets) == 1, f"{path} does not carry one octet string"
              data = octets[0]
              assert struct.unpack_from("<I", data, 0)[0] == 2, f"{path} is not a version 2 module"
              entries = struct.unpack_from("<I", data, 20)[0]
              assert len(data) == 24 + entries * 24, f"{path} holds {len(data)} bytes for {entries} entries"
              return data


          picked = {}
          for sidecar in glob.glob("out/ipsw/*/*.json"):
              record = json.loads(Path(sidecar).read_text())
              component = record.get("component")
              target = Path(sidecar).with_suffix("")
              if component in ("StaticTrustCache", "Cryptex1,SystemTrustCache") and target.is_file():
                  picked[component] = target
          assert set(picked) == {"StaticTrustCache", "Cryptex1,SystemTrustCache"}, picked
          static = module(picked["StaticTrustCache"])
          system = module(picked["Cryptex1,SystemTrustCache"])
          bundle = struct.pack("<3I", 2, 12, 12 + len(static)) + static + system
          digest = hashlib.sha256(bundle).hexdigest()
          assert digest == "7416ca4f8377146626bb284e2133c76bee6cb4e3ee0af5d648b186235a7323a7", digest
          Path("out/fuxi/trust.bundle").parent.mkdir(parents=True, exist_ok=True)
          Path("out/fuxi/trust.bundle").write_bytes(bundle)
          print("static", len(static), "system", len(system), "bundle", len(bundle), digest)
          PY

      - name: Build the payload
        working-directory: unixnu
        run: |
          set -euo pipefail
          trust=""
          if [ -f out/fuxi/trust.bundle ]; then
            trust="--trust-cache out/fuxi/trust.bundle"
            shasum -a 256 out/fuxi/trust.bundle
          fi
          ./unixnu build payload --uefi ../uefi-fuxi --unique-chip-id "$UNIXNU_UNIQUE_CHIP_ID" $trust
          find out/fuxi/payload -maxdepth 1 -type f -exec ls -l {} \;
          cat out/fuxi/payload/payload.json

      - name: Build the firmware
        working-directory: unixnu
        run: |
          set -euo pipefail
          ./unixnu build firmware --uefi ../uefi-fuxi --target DEBUG
          ls -l ../uefi-fuxi/Build/fuxiPkg/DEBUG_CLANGPDB/FV/ || true

      - name: Pack the boot image
        working-directory: unixnu
        run: |
          set -euo pipefail
          python3 ../uefi-fuxi/scripts/bootimage.py \
            --unixnu-root . \
            --device ../fuxi \
            --uefi ../uefi-fuxi \
            --ramdisk out/fuxi/payload/payload.img \
            -o out/fuxi/boot/boot.img
          ls -l out/fuxi/boot
          cat out/fuxi/boot/bootimage.json || true
          shasum -a 256 out/fuxi/boot/boot.img

      - name: Collect the image and the logs
        if: always()
        run: |
          set -euo pipefail
          mkdir -p collect
          cp unixnu/out/fuxi/boot/boot.img collect/ 2>/dev/null || true
          cp unixnu/out/fuxi/boot/bootimage.json collect/ 2>/dev/null || true
          cp unixnu/out/fuxi/payload/payload.img collect/ 2>/dev/null || true
          cp unixnu/out/fuxi/payload/payload.json collect/ 2>/dev/null || true
          cp -R unixnu/out/fuxi/logs collect/logs 2>/dev/null || true
          (cd collect && shasum -a 256 boot.img payload.img 2>/dev/null || true)
          du -sh collect/* 2>/dev/null || true

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuxi-t50-boot-${{ github.run_attempt }}
          path: collect
          if-no-files-found: warn
